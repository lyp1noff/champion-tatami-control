services:
  db:
    image: postgres:15
    container_name: champion-tatami-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: champ_local
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    pull_policy: build
    container_name: champion-tatami-backend
    image: champion-tatami-backend:latest
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - EXTERNAL_API_URL=${EXTERNAL_API_URL}
      - EXTERNAL_API_TOKEN=${EXTERNAL_API_TOKEN}
      - DEV_MODE=${DEV_MODE}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    pull_policy: build
    container_name: champion-tatami-frontend
    image: champion-tatami-frontend:latest
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
  
  outbox:
    build:
      context: ./outbox
      dockerfile: ./Dockerfile
    image: champion-tatami-outbox:latest
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - EXTERNAL_API_URL=${EXTERNAL_API_URL}
      - EXTERNAL_API_TOKEN=${EXTERNAL_API_TOKEN}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pg_data:
